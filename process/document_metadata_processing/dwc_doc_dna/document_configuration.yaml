# Official title of the document assigned by authors.
documentTitle: "DNA Derived Data List of Terms"

# Abstract of document written by authors.
abstract: The DNA derived data extension captures information relating to DNA-derived occurrence records. It is based on MIxS (Minimum Information about any (x) Sequence), with additions from GGBN and MIQE. This document lists all terms in namespaces currently used by the extension.

# This value is generally the name of the task group that created the document.
