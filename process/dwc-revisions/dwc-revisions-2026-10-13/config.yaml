# DEGREE OF ESTABLISHMENT LIST OF TERMS
- document: http://rs.tdwg.org/dwc/doc/doe/
  documentTitle: Degree of Establishment Controlled Vocabulary List of Terms
  abstract: The Darwin Core term `dwc:degreeOfEstablishment` provides information about degree to which a `dwc:Organism` survives, reproduces, and expands its range at the given place and time. The Degree of Establishment Controlled Vocabulary provides terms that should be used as values for `dwc:degreeOfEstablishment` and `dwciri:degreeOfEstablishment`.
