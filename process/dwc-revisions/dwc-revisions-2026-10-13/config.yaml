# DARWIN CORE NAMESPACE
- document: http://rs.tdwg.org/dwc/terms/namespace/
  documentTitle: Darwin Core namespace policy
  abstract: All terms defined by Darwin Core must be assigned a unique Uniform Resource Identifier (URI). For convenience, the term URIs assigned and managed by Darwin Core are grouped into collections known as Darwin Core namespaces. Darwin Core also uses terms from namespaces maintained by other standards; those borrowed namespaces are not governed by this policy. This document describes how term URIs are allocated by the Darwin Core Maintenance Group and the policies associated with Darwin Core namespaces.
