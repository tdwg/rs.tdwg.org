- vocabulary: https://rs.tdwg.org/bdqffdq/
  vocab_type: 1
  list_of_terms_iri: https://rs.tdwg.org/bdqffdq/doc/list/
  vocabulary_label: Biodiversity Data Quality Fitness for Use Framework (Ontology)
  vocabulary_description: 'The classes and object properties found in this ontology are dedicated to fundamental and derived concepts from the Fitness For Use Framework described in the paper by Veiga et al., available at: http://journals.plos.org/plosone/article?id=10.1371/journal.pone.0178731 as modified to describe data quality fitness for use Tests in the TDWG BDQ Standard.'
  dc_creator: 'TDWG Biodiversity Data Quality Interest Group Task Group 2: Data Quality Tests and Assertions'
  dcterms_license: https://creativecommons.org/licenses/by/4.0/
